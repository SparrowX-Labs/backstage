projectName: sparrowx
environment: dev

serviceName: backstage

replicaCount: 1

appPort: 7007
# extraAnnotations:
# extraLabels:

rbac:
  create: true

resources:
  size: medium

database:
  enabled: true
  name: backstage
  engine: postgres
  port: 5432
  host: backstage-postgres.dev.sparrowx.internal

ingress:
  enabled: true
  className: alb
  host: backstage.dev.mo2cloud.com
  name: backstage
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/group.name: backstage
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/backend-protocol: HTTP
  # alb.ingress.kubernetes.io/certificate-arn: {{ requiredEnv "ACM_CERTIFICATE_ARN" | quote }}

servicemonitor:
  enabled: true

probePath: /.backstage/health/v1/readiness
livenessProbe:
  enabled: true
  path: /.backstage/health/v1/liveness
  initialDelaySeconds: 60
readinessProbe:
  enabled: true
  initialDelaySeconds: 30
startupProbe:
  enabled: true
  path: /.backstage/health/v1/liveness
  initialDelaySeconds: 30

container:
  env:
    - name: APP_BASE_URL
      value: https://backstage.dev.mo2cloud.com
    - name: APP_PORT
      value: "7007"
    - name: GITHUB_TOKEN
      valueFrom:
        secretKeyRef:
          name: backstage-secrets
          key: GITHUB_TOKEN
