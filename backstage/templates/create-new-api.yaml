apiVersion: scaffolder.backstage.io/v1beta3
# https://backstage.io/docs/features/software-catalog/descriptor-format#kind-template
kind: Template
metadata:
  name: create-new-api
  title: Create New API
  description: A template that provisions and creates a new api.
  tags:
    - service
    - dev
    - api
    - backend
  owners:
    - group:platform-team
    - user:mohaned-awad
spec:
  owner: group:platform-team
  type: service

  # These parameters are used to generate the input form in the frontend, and are
  # used to gather input data for the execution of the template.
  parameters:
    - title: Service Name
      required:
        - serviceName
      properties:
        serviceName:
          title: Service Name
          type: string
          description: The name of the service to be created
          ui:autofocus: false
          ui:options:
            autocomplete: "off"
            rows: 1

    - title: Service Configuration
      required:
        - dbNeeded
        - dbName
        - dbType
        - replicaCount
      properties:
        dbNeeded:
          title: Is Database Connection Needed
          description: Defines wether a connection to database is needed or not, if not, enter N/A or None in the Database Name filed.
          type: boolean
          default: true
        dbName:
          title: Database Name
          description: The name of the database, the service should connect to
          type: string
          ui:autofocus: false
          ui:options:
            autocomplete: "off"
        dbType:
          title: Database Type
          description: The type of the database, the service should connect to
          type: string
          enum:
            - mysql
            - mongodb
          ui:widget: radio
        replicaCount:
          title: Replica Count
          description: Number of pods required for the service
          type: integer
          minimum: 1
          maximum: 5
          errorMessage: "Allowed values are in range 1 - 5, for other values, update the helm file value manually after creation."
    
    - title: Docker Base Image
      required:
        - dockerBaseImage
      properties:
        dockerBaseImage:
          title: Base Image to be used in the Dockerfile
          description: Defines which image to be used in the docker file.
          type: string
          enum:
            - node:16.19.0-alpine
            - node:20-alpine
            - node:22-alpine
          default: node:16.19.0-alpine
    



  # These steps are executed in the scaffolder backend, using data that we gathered
  # via the parameters above.
  steps:
    - id: backstage_request_with_input
      name: backstage request
      action: http:backstage:request
      input:
        method: 'POST'
        path: '/proxy/fastapi/create-new-service'
        headers:
          Content-Type: 'application/json'
          X-Request-Source: 'Backstage'
        body: |
          {
            "service-name": "${{ parameters.serviceName }}",
            "service-path": "${{ parameters.servicePath }}",
            "db-needed": "${{ parameters.dbNeeded }}",
            "db-name": "${{ parameters.dbName }}",
            "db-type": "${{ parameters.dbType }}",
            "replica-count": "${{ parameters.replicaCount }}",
            "docker-base-image": "${{ parameters.dockerBaseImage }}",
          }
            
    - id: capture_output
      name: Capture Response
      action: debug:log
      input:
        message: |
          === Backstage HTTP Response ===
          Code: ${{ steps["backstage_request_with_input"].output.code }}

          === Script Return ===
          Logs: ${{ steps["backstage_request_with_input"].output.body.logs }}
          Merge URLs:
          ${{ steps["backstage_request_with_input"].output.body.merge_request_urls[0] }}
          ${{ steps["backstage_request_with_input"].output.body.merge_request_urls[1] }}
          ${{ steps["backstage_request_with_input"].output.body.merge_request_urls[2] }}

  output:
    links:
      - title: "ECR Merge Request"
        url: ${{ steps["backstage_request_with_input"].output.body.merge_request_urls[0] }}
        icon: github
      - title: "Argo Apps Merge Request"
        url: ${{ steps["backstage_request_with_input"].output.body.merge_request_urls[1] }}
        icon: github
      - title: "File Uploads Commit"
        url: ${{ steps["backstage_request_with_input"].output.body.merge_request_urls[2] }}
        icon: github